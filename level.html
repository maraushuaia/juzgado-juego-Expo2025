<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de Preguntas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style-level.css" />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>Selecciona el Nivel</h1>
        <div class="level-selection">
          <div class="level-option" id="level-1">
            <img
              src="/assets/images-logos/imagen-nivel-inicial.png"
              alt="Nivel Inicial"
            />
            <p>Inicial</p>
          </div>
          <div class="level-option" id="level-2">
            <img
              src="/assets/images-logos/imagen-nivel-medio.png"
              alt="Nivel Medio"
            />
            <p>Medio</p>
          </div>
        </div>
      </div>
    </div>
    <script src="script-level.js"></script>
  </body>
</html>
